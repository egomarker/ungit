name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  prebuilt-assets:
    name: Verify prebuilt browser assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Use Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build browser assets
        run: bun run build

      - name: Verify committed browser assets
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            public/css/styles.css
            public/css/styles-light.css
            public/js/ungit.js
            public/js/raven.min.js
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error file=$asset::Required prebuilt runtime asset is missing"
              exit 1
            fi
          done

          for manifest in components/*/ungit-plugin.json; do
            component_dir="$(dirname "$manifest")"
            javascript="$(jq -r '.exports.javascript // empty' "$manifest")"
            css="$(jq -r '.exports.css // empty' "$manifest")"

            if [[ -n "$javascript" && ! -f "$component_dir/$javascript" ]]; then
              echo "::error file=$manifest::Missing prebuilt bundle: $component_dir/$javascript"
              exit 1
            fi
            if [[ -n "$css" ]]; then
              light_css="${css%.css}-light.css"
              for stylesheet in "$css" "$light_css"; do
                if [[ ! -f "$component_dir/$stylesheet" ]]; then
                  echo "::error file=$manifest::Missing prebuilt stylesheet: $component_dir/$stylesheet"
                  exit 1
                fi
              done
            fi
          done

          if ! git diff --exit-code -- components public/css public/js public/fonts; then
            echo '::error::Committed browser assets are stale. Run `bun run build` and commit the result.'
            exit 1
          fi

          untracked_assets="$(
            git ls-files --others --exclude-standard -- components public/css public/js public/fonts
          )"
          if [[ -n "$untracked_assets" ]]; then
            echo '::error::The build generated untracked runtime assets:'
            printf '%s\n' "$untracked_assets"
            exit 1
          fi

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '*']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # linux dependencies
      # https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-latest'
      - run: sudo add-apt-repository ppa:git-core/ppa -y && sudo apt-get update -q && sudo apt-get install -y git
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '*'
      # macos dependencies
      - run: brew reinstall git
        if: matrix.os == 'macos-latest' && matrix.node-version == '*'
      # windows dependencies
      # https://github.community/t5/GitHub-Actions/TEMP-is-broken-on-Windows/td-p/30432
      - run: echo "TEMP=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
        if: matrix.os == 'windows-latest'
      - run: choco upgrade git
        if: matrix.os == 'windows-latest' && matrix.node-version == '*'

      - run: git --version
      - run: git config --global user.email "test@testy.com"
      - run: git config --global user.name "Test testy"
      - run: git config --global protocol.file.allow always # tests use file based submodules see #1539

      - run: npm ci
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
      - run: npm run build
      - run: npm test

      # publish artifacts
      - run: npm pack
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
      - run: npm run electronpackage -- --all
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
      - run: npm run electronzip
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'

      - name: Upload npm pack
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit
          path: ungit-*.tgz
          archive: false
          retention-days: 7

      - name: Upload ungit-darwin-arm64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-darwin-arm64
          path: dist/ungit-darwin-arm64.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-darwin-x64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-darwin-x64
          path: dist/ungit-darwin-x64.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-linux-arm64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-linux-arm64
          path: dist/ungit-linux-arm64.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-linux-armv7l
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-linux-armv7l
          path: dist/ungit-linux-armv7l.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-linux-x64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-linux-x64
          path: dist/ungit-linux-x64.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-win32-arm64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-win32-arm64
          path: dist/ungit-win32-arm64.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-win32-ia32
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-win32-ia32
          path: dist/ungit-win32-ia32.zip
          archive: false
          retention-days: 7

      - name: Upload ungit-win32-x64
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: ungit-win32-x64
          path: dist/ungit-win32-x64.zip
          archive: false
          retention-days: 7
